name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: List Projects and Tasks
      run: ./gradlew projects tasks --no-daemon

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Verify APK Generated
      run: find . -name "*.apk" -type f

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AlertChat-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
